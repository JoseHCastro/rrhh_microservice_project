spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  graphql:
    graphiql:
      enabled: ${GRAPHIQL_ENABLED:true}

logging:
  level:
    com.example.rrhh: ${LOG_LEVEL:DEBUG}
    org.springframework.graphql: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE # Para ver los parámetros SQL
