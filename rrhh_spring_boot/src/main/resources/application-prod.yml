spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  graphql:
    graphiql:
      enabled: ${GRAPHIQL_ENABLED:false}

logging:
  level:
    com.example.rrhh: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    root: WARN

server:
  ssl:
    enabled: false   # Configurar TLS mediante proxy (Nginx/ALB) o habilitar aquí si hay certificado
