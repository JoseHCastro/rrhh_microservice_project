spring:
  application:
    name: rrhh-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rrhh_db}
    username: ${DB_USERNAME:rrhh_user}
    password: ${DB_PASSWORD:rrhh_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway gestiona el schema, Hibernate SOLO valida
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
    open-in-view: false           # IMPORTANTE: deshabilitar siempre

  graphql:
    path: ${GRAPHQL_PATH:/graphql}
    schema:
      printer:
        enabled: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

# ══ JWT & APP CONFIG ══════════════════════════════
app:
  jwt:
    secret: ${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uU3lzdGVtMjAyNQ==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  aws:
    enabled: ${AWS_ENABLED:false}
    region: ${AWS_REGION:us-east-1}
    s3:
      bucket: ${AWS_S3_BUCKET:rrhh-preplanillas-dev}
      endpoint: ${AWS_S3_ENDPOINT:}
    dynamodb:
      table-auditoria: ${DYNAMODB_TABLE_AUDITORIA:rrhh_bitacora}
      endpoint: ${DYNAMODB_ENDPOINT:}
  fcm:
    enabled: ${FCM_ENABLED:false}
    credentials-path: ${FCM_CREDENTIALS_PATH:./firebase-service-account.json}
    project-id: ${FCM_PROJECT_ID:rrhh-project}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

server:
  port: ${SERVER_PORT:8080}
